<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>אימון בבית · Home Training</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Pixelify+Sans:wght@500;700&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: one column, phone first. Home = 3 child cards + shared day table. Each child has its own world: A sticker garden, B bubble lab, C video-game quest (dark). */
:root{color-scheme:light;--bg:#E4F1FB;--card:#fff;--btn:#fff;--ink:#17324D;--mute:#5E7890;--line:#C9DDED;
--a:#FF6B5E;--b:#F5A300;--c:#12A88C;--ok:#12A88C;--k:#17324D;
--disp:'Fredoka','Rubik',system-ui,sans-serif;--body:'Rubik',system-ui,sans-serif}
body[data-k=a]{--bg:#FFE9F0;--line:#F6C6D3;--mute:#8A5B6B;--ink:#4A2030}
body[data-k=b]{--bg:#DDF4FF;--line:#B5DDF2}
/* child C: an original block-world look (square blocks, pixel type); no characters or artwork from any existing game */
body[data-k=c]{color-scheme:dark;--bg:#24301F;--card:#3A3F36;--btn:#5A5E53;--ink:#F4F4E8;--mute:#C6CBB6;--line:#191B17;--c:#3F9E46;--disp:'Pixelify Sans','Rubik',sans-serif;
 background-image:linear-gradient(rgba(255,255,255,.05) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.05) 2px,transparent 2px);background-size:32px 32px}
body[data-k=c] .card,body[data-k=c] button,body[data-k=c] .prog,body[data-k=c] .chip,body[data-k=c] .file{border-radius:3px}
body[data-k=c] .card{border:3px solid var(--line);box-shadow:inset -4px -4px 0 rgba(0,0,0,.3),inset 4px 4px 0 rgba(255,255,255,.1)}
body[data-k=c] button{border:3px solid var(--line);box-shadow:inset -3px -3px 0 rgba(0,0,0,.35),inset 3px 3px 0 rgba(255,255,255,.2);font-family:var(--disp)}
body[data-k=c] .ring{border-radius:6px}body[data-k=c] .prog{height:16px;border:3px solid var(--line)}
.inv{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;direction:ltr}.inv span{aspect-ratio:1;display:grid;place-items:center;background:var(--btn);border:2px solid var(--line);font-size:18px}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 17px/1.5 var(--body);padding:16px;transition:background .3s}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--disp);margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:28px}h2{font-size:24px}h3{font-size:18px}
button{font:500 17px var(--body);color:inherit;border:0;border-radius:14px;padding:12px 16px;cursor:pointer;background:var(--btn);box-shadow:0 2px 0 var(--line)}
button:active{transform:translateY(2px)}
button:focus-visible,input:focus-visible,label:focus-within{outline:3px solid var(--ink);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
.pri{background:var(--k);color:#fff;font:700 20px var(--disp);box-shadow:0 4px 0 rgba(0,0,0,.2);padding:14px 20px;width:100%}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}.ctr{justify-content:center}
.card{background:var(--card);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.kid{border-inline-start:10px solid var(--k);text-align:start;width:100%;box-shadow:0 3px 0 var(--line);flex-direction:row;align-items:center;gap:14px}
.av{font-size:44px;line-height:1;position:relative}.crown{position:absolute;top:-16px;inset-inline-start:8px;font-size:22px}
.kid .nm{font:700 22px var(--disp)}.kid .meta{color:var(--mute);font-size:15px}
.chip{display:inline-block;border-radius:99px;padding:2px 10px;font-size:14px;font-weight:500;background:var(--bg);color:var(--mute)}
.chip.on{background:var(--ok);color:#fff}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 4px;text-align:center;font-size:14px;min-width:38px;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-weight:500}td.n{text-align:start;font-weight:700;min-width:84px;position:sticky;inset-inline-start:0;background:var(--card)}
td b{display:inline-block;min-width:26px;border-radius:8px;padding:2px 0;color:#fff;background:var(--k)}
.big{font:700 clamp(30px,10vw,52px)/1.15 var(--disp);text-align:center;overflow-wrap:anywhere}
.mid{font:500 21px/1.5 var(--body);text-align:center}
.story{font:500 22px/1.9 var(--body);direction:rtl;text-align:right;white-space:pre-line}
.emo{font-size:76px;text-align:center;line-height:1.1}
.how{color:var(--mute)}.cen{text-align:center}small{color:var(--mute)}
.prog{height:12px;border-radius:9px;background:var(--line);overflow:hidden}.prog i{display:block;height:100%;background:var(--k);transition:width .3s}
.ring{--p:0;width:150px;height:150px;border-radius:50%;margin:0 auto;display:grid;place-items:center;font:700 52px var(--disp);
background:radial-gradient(var(--card) 58%,transparent 59%),conic-gradient(var(--k) calc(var(--p)*1%),var(--line) 0)}
.track{position:relative;height:64px;border-radius:32px;background:var(--bg);overflow:hidden;direction:ltr}
.track span{position:absolute;top:8px;font-size:40px;line-height:1;left:calc(var(--p)*1% - var(--p)*.5px);transition:left .1s linear}
.track em{position:absolute;right:8px;top:10px;font-size:36px;font-style:normal}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.two button{font:700 24px var(--disp);padding:16px 8px}
.pic button{font-size:64px;padding:14px 4px;line-height:1.1}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid3 button{font-size:44px;padding:14px 0;min-height:84px}
.ten{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.ten button{padding:12px 0;font-weight:700}
.sel{background:var(--k)!important;color:#fff}.gone{visibility:hidden}
.stk{display:flex;flex-wrap:wrap;gap:6px;font-size:28px;justify-content:center}.stk span.no{opacity:.18;filter:grayscale(1)}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pop{animation:pop .5s}@keyframes pop{0%{transform:scale(.5)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-8px)}}
.cf{position:fixed;top:-40px;font-size:28px;pointer-events:none;animation:fall 2.2s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
input[type=text]{font:500 17px var(--body);border:2px solid var(--line);border-radius:12px;padding:10px;width:100%;color:var(--ink);background:var(--card)}
textarea{width:100%;min-height:110px;font:14px var(--body);border-radius:12px;border:2px solid var(--line);padding:8px}
.file{display:block;text-align:center;background:var(--bg);border-radius:14px;padding:12px;cursor:pointer;font-weight:500}
.file input{position:absolute;opacity:0;width:1px;height:1px}audio{width:100%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<script>
"use strict";
/* ---------- helpers ---------- */
const app=document.getElementById('app');
function h(tag,p,...kids){const e=document.createElement(tag);if(p)for(const k in p){if(k==='class')e.className=p[k];else if(k==='style')e.style.cssText=p[k];else if(k.startsWith('on'))e[k]=p[k];else e.setAttribute(k,p[k]);}
 for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)));}return e;}
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};
let L='he';
const T=(he,en)=>L==='he'?he:en;const li=()=>L==='he'?0:1;
const pick=(arr,i,n)=>Array.from({length:Math.min(n,arr.length)},(_,k)=>arr[(i*n+k)%arr.length]);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const dstr=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>dstr(new Date());const ago=n=>{const d=new Date();d.setDate(d.getDate()-n);return d;};
function canSay(){try{const v=speechSynthesis.getVoices();return !v.length||v.some(x=>x.lang.toLowerCase().startsWith(L));}catch(e){return false;}}
function voice(){const sc=v=>(/natural|neural|enhanced|premium|siri/i.test(v.name)?4:0)+(/google|samantha|ava|allison|karen|moira|serena|carmit/i.test(v.name)?2:0)+(/en-us|he-il/i.test(v.lang)?1:0)-(/espeak|compact|robot|albert|fred|zarvox|bad|bells|boing|bubbles|cellos|whisper|trinoids|organ|jester|junior|ralph|kathy|superstar|wobble|good news/i.test(v.name)?9:0);
 try{return speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith(L)).sort((a,b)=>sc(b)-sc(a))[0]||null;}catch(e){return null;}}
function say(t,keep){try{const go=()=>{try{const u=new SpeechSynthesisUtterance(t),v=voice();if(v)u.voice=v;u.lang=v?v.lang:(L==='he'?'he-IL':'en-US');u.rate=.9;speechSynthesis.resume();speechSynthesis.speak(u);}catch(e){}};
 if(!keep&&(speechSynthesis.speaking||speechSynthesis.pending)){speechSynthesis.cancel();setTimeout(go,200);}else go();}catch(e){}}
/* charge bar: the button stays locked for the time it really takes to say the thing */
let MIC,MBUF=null;const TH=.035;
function ensureMic(){if(MIC!==undefined)return;MIC=null;try{navigator.mediaDevices.getUserMedia({audio:true}).then(st=>{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume();const an=AC.createAnalyser();an.fftSize=1024;AC.createMediaStreamSource(st).connect(an);MBUF=new Float32Array(an.fftSize);MIC=an;}).catch(()=>{MIC=null;});}catch(e){}}
function level(){try{MIC.getFloatTimeDomainData(MBUF);let q=0;for(let i=0;i<MBUF.length;i++)q+=MBUF[i]*MBUF[i];return Math.sqrt(q/MBUF.length);}catch(e){return 1;}}
function lock(u,sec){if(!sec)return u;const base=u.textContent;let t=0;u.disabled=true;u.textContent='🔋 0%';const tm=setInterval(()=>{if(!MIC||level()>TH)t+=.1;
  if(t>=sec||!u.isConnected){clearInterval(tm);u.disabled=false;u.textContent=base;}else u.textContent=(MIC?'🎤 ':'🔋 ')+Math.round(t/sec*100)+'%';},100);return u;}
/* robot challenge: speech recognition must understand the word */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const NRM=x=>x.toLowerCase().replace(/[^\p{L}\p{N} ]/gu,'').trim();
function robotScore(target,cb,out){try{const r=new SR(),tw=NRM(target).split(' ').filter(Boolean);let best=0,heard='…',voiced=0;const iv=setInterval(()=>{if(MIC&&level()>TH)voiced+=.1;},100);
  r.lang=L==='he'?'he-IL':'en-US';r.maxAlternatives=5;
  r.onresult=e=>{Array.from(e.results[0]).forEach((a,j)=>{const hw=NRM(a.transcript).split(' '),sc=tw.filter(w=>hw.includes(w)).length/tw.length;if(j===0)heard=a.transcript;if(sc>best)best=sc;});};
  r.onerror=()=>{};r.onend=()=>{clearInterval(iv);if(MIC&&voiced<.8){out.textContent='🤖 '+T('לא שמעתי קול. נסה שוב.','I heard no voice. Try again.');return;}cb(best,heard);};
  r.start();out.textContent='🤖 '+T('מקשיב...','Listening...');}catch(e){out.textContent='';cb(-1,'');}}
function robot(target,onOk,out){try{const r=new SR(),n=x=>x.toLowerCase().replace(/[^\p{L}\p{N} ]/gu,'').trim();r.lang=L==='he'?'he-IL':'en-US';r.maxAlternatives=5;
  r.onresult=e=>{const alts=Array.from(e.results[0]).map(a=>a.transcript),hit=alts.some(a=>n(a).includes(n(target)));out.textContent='🤖 '+(hit?T('הבנתי: ','I understood: '):T('שמעתי: ','I heard: '))+alts[0];if(hit)onOk();else bad();};
  r.onerror=()=>{out.textContent='🤖 '+T('לא שמעתי. נסה שוב.','I did not hear you. Try again.');};r.start();out.textContent='🤖 '+T('מקשיב...','Listening...');}catch(e){out.textContent='';}}
const sayBtn=t=>canSay()?h('button',{onclick:()=>say(t),'aria-label':T('השמע','Listen')},'🔊'):null;
let AC=null;function beep(f,d){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f||660;o.type='triangle';g.gain.value=.08;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+(d||.18));o.stop(AC.currentTime+(d||.18));}catch(e){}}
let gems=0,hud=null,hudI='💎';
const win=()=>{beep(660,.12);setTimeout(()=>beep(880,.2),120);if(hud&&hud.isConnected){gems++;hud.textContent=hudI+' '+gems;hud.classList.remove('pop');void hud.offsetWidth;hud.classList.add('pop');if(hudI==='💎')sparkle();}};
function sparkle(){for(let i=0;i<6;i++){const c=h('span',{class:'cf',style:'left:'+Math.random()*96+'vw;font-size:20px'},'✨');document.body.append(c);setTimeout(()=>c.remove(),2400);}}const bad=()=>beep(180,.2);
function confetti(set){for(let i=0;i<18;i++){const c=h('span',{class:'cf',style:'left:'+Math.random()*96+'vw;animation-delay:'+Math.random()*.6+'s'},set[i%set.length]);document.body.append(c);setTimeout(()=>c.remove(),3200);}}
function shake(x){x.classList.remove('shake');void x.offsetWidth;x.classList.add('shake');bad();}
/* run items one after another */
function seq(b,items,draw,end){let i=0;const go=()=>{if(i>=items.length){b.replaceChildren(h('div',{class:'emo pop'},'🌟'));win();return end();}draw(items[i],()=>{i++;go();},i);};go();}
/* "I said it" button: n taps then cb */
function said(n,cb,sec){let c=0;const x=h('button',{class:'pri'});const d=()=>{x.textContent=T('אמרתי!','I said it!')+' '+'★'.repeat(c)+'☆'.repeat(n-c);lock(x,sec);};x.onclick=()=>{c++;beep(520+c*80,.1);if(c>=n)cb();else d();};d();return x;}
const wcard=(it,auto)=>{if(auto)say(it[0],true);return [h('div',{class:'emo bob'},it[1]),h('div',{class:'row ctr'},h('span',{class:'mid'},it[0]),sayBtn(it[0]))];};
const count=(i,n)=>h('small',null,(i+1)+' / '+n);

/* ---------- children ---------- */
const KIDS=[{id:'a',av:'👸',col:'var(--a)',f:true,lang:'en'},{id:'b',av:'🦁',col:'var(--b)',lang:'en'},{id:'c',av:'⛏️',col:'var(--c)',lang:'he'}];
const RANKS=[[0,'מתחיל','Rookie'],[3,'חוקר','Explorer'],[8,'אלוף','Pro'],[16,'מאסטר','Master'],[30,'אגדה','Legend'],[50,'על-אגדה','Superlegend']];
const TIERS=[[0,'עץ','Wood'],[4,'אבן','Stone'],[9,'ברזל','Iron'],[16,'זהב','Gold'],[25,'יהלום','Diamond'],[36,'נתרייט','Netherite']];
const STK='🦄 🐶 🐱 🐰 🐼 🐸 🦋 🐢 🐬 🦉 🐝 🦕 🌈 🍓 🍉 🧁 🍩 🎈 🎀 ⭐ 🌻 🚀 🎠 🪁 🐙 🦜 🐞 🍭 🎨 🧸 🦩 🐳 🌙 🍒 🎪 🛼 🪄 👑 💎 🏆'.split(' ');
const STKA='👑 💎 🦄 🏰 🪄 🎀 🌈 🧁 🦋 🌸 🩰 💖 🧚 🐱 🍓 🎠 🌟 🍭 🦢 🐰 🎈 🍩 🌷 🧸 🐬 🦩 🍒 🎨 🌙 🪞 💍 🐞 🍉 🛼 🎪 🐼 🦜 🐳 🪁 🏆'.split(' ');
const MAXDAY=3,PERLV=6;

/* ---------- child A: S and SH, pictures and sound, no reading needed ---------- */
/* [word, picture, sound, 0 = sound at the start / 1 = elsewhere] */
const AW={he:[['סוס','🐴','s',0],['שמש','☀️','sh',0],['סל','🧺','s',0],['שן','🦷','sh',0],['ספר','📖','s',0],['שעון','⏰','sh',0],['סבון','🧼','s',0],['שוקולד','🍫','sh',0],['סירה','⛵','s',0],['שועל','🦊','sh',0],['סלט','🥗','s',0],['שלג','❄️','sh',0],['סוכריה','🍭','s',0],['שום','🧄','sh',0],['סולם','🪜','s',0],['שושנה','🌹','sh',0],
 ['כוס','🥛','s',1],['דבש','🍯','sh',1],['אוטובוס','🚌','s',1],['נחש','🐍','sh',1],['פסנתר','🎹','s',1],['אש','🔥','sh',1],['כיסא','🪑','s',1],['עכביש','🕷️','sh',1],['מספריים','✂️','s',1],['משקפיים','👓','sh',1]],
 en:[['sun','☀️','s',0],['ship','🚢','sh',0],['sock','🧦','s',0],['sheep','🐑','sh',0],['soap','🧼','s',0],['shoe','👟','sh',0],['seal','🦭','s',0],['shark','🦈','sh',0],['soup','🍲','s',0],['shell','🐚','sh',0],['sandwich','🥪','s',0],['shirt','👕','sh',0],['salad','🥗','s',0],['shower','🚿','sh',0],
 ['bus','🚌','s',1],['fish','🐟','sh',1],['house','🏠','s',1],['dish','🍽️','sh',1],['mouse','🐭','s',1],['toothbrush','🪥','sh',1],['horse','🐴','s',1],['trash','🗑️','sh',1],['dress','👗','s',1],['paintbrush','🖌️','sh',1]]};
const APAIR=[['sea','🌊','she','👧'],['sip','🥤','ship','🚢'],['sock','🧦','shock','⚡'],['sell','💰','shell','🐚'],['seat','💺','sheet','📄'],['sew','🧵','show','🎭']];
const AREB={he:[['הסוס שותה מים בשמש','🐴 💧 ☀️'],['יש לי שש סוכריות','6️⃣ 🍭'],['הנחש ישן על הכיסא','🐍 😴 🪑'],['השועל מסתכל על השמש','🦊 👀 ☀️'],['סבון בתוך הסל','🧼 🧺'],['דבש בתוך הכוס','🍯 🥛'],['העכביש על הספר','🕷️ 📖'],['שוקולד וסוכריה','🍫 🍭']],
 en:[['The sheep sees the sun','🐑 👀 ☀️'],['The fish swims in the sea','🐟 🌊'],['She washes the dish with soap','👧 🍽️ 🧼'],['The shark has a sock','🦈 🧦'],['Six ships in the sunshine','6️⃣ 🚢 ☀️'],['The mouse has a shoe','🐭 👟'],['Soup in a shell','🍲 🐚'],['The horse is on the bus','🐴 🚌']]};
const SND={s:['🐍',['ססס','Sss']],sh:['🤫',['ששש','Shh']]};
const AG={
 sort:{t:['נחש או שקט?','Snake or Shh?'],h:['אומרים את המילה. איזה צליל שומעים?','Say the word. Which sound do you hear?'],
  g(b,ok,x){seq(b,x.w,(it,nx,i)=>{const mk=v=>{const u=h('button',null,SND[v][0]+' '+SND[v][1][li()]);u.onclick=()=>v===it[2]?(beep(700),nx()):shake(u);return u;};
   b.replaceChildren(count(i,x.w.length),...wcard(it,true),h('div',{class:'two'},mk('s'),mk('sh')));},ok);}},
 monster:{t:['מאכילים את המפלצת','Feed the monster'],h:['המפלצת אוכלת היום רק מילים עם הצליל הזה. בוחרים את התמונה הנכונה ואומרים את המילה.','Today the monster only eats words with this sound. Pick the right picture and say the word.'],
  g(b,ok,x){const good=x.all.filter(w=>w[2]===x.tg),other=x.all.filter(w=>w[2]!==x.tg);
   seq(b,pick(good,x.i,5),(it,nx,i)=>{const mon=h('div',{class:'emo bob'},'👾'),o=other[(x.i*5+i)%other.length],row=h('div',{class:'two pic'});
    shuf([it,o]).forEach(w=>{const u=h('button',{'aria-label':w[0]},w[1]);u.onclick=()=>{if(w!==it){mon.textContent='🤢';return shake(u);}mon.textContent='😋';say(it[0]);row.replaceWith(said(1,nx));};row.append(u);});
    b.replaceChildren(count(i,5),h('div',{class:'mid'},SND[x.tg][0]+' '+SND[x.tg][1][li()]),mon,row);},ok);}},
 memory:{t:['זיכרון','Memory'],h:['הופכים שני קלפים ומחפשים זוג. אומרים כל מילה שרואים.','Flip two cards and find the pair. Say every word you see.'],

const SEG={b:['בועות','Bubbles','🫧'],v:['קול ישר','Steady voice','〰️'],s:['סירנה: עולים ויורדים','Siren: up and down','🎢'],c:['שרים שיר','Sing a song','🎵']};
const STG=[0,{n:['בועות קטנות וקבועות','Small steady bubbles'],seg:[['b',6]]},{n:['בועות, קול, בועות','Bubbles, voice, bubbles'],seg:[['b',2],['v',4],['b',2]]},
 {n:['בועות, סירנה, בועות','Bubbles, siren, bubbles'],seg:[['b',2],['s',4],['b',2]]},{n:['בועות, שיר, בועות','Bubbles, a song, bubbles'],seg:[['b',2],['c',6],['b',2]]}];
function straw(b,ok,list){const reps=list.flatMap(x=>[x,x]);
 seq(b,reps,(st,nx,i)=>{const S2=STG[st],tot=S2.seg.reduce((a,x)=>a+x[1],0);let x0=0,svg='<line x1="0" y1="78" x2="300" y2="78" stroke="#1F5FBF" stroke-width="5"/>';
  S2.seg.forEach(g=>{const a=x0/tot*300,z=(x0+g[1])/tot*300,m=(a+z)/2;x0+=g[1];
   if(g[0]==='b')svg+='<text x="'+m+'" y="68" text-anchor="middle" font-size="22">🫧🫧</text>';
   if(g[0]==='v')svg+='<line x1="'+(a+6)+'" y1="44" x2="'+(z-6)+'" y2="44" stroke="#F0483E" stroke-width="6" stroke-linecap="round"/>';
   if(g[0]==='s')svg+='<path d="M'+(a+6)+' 62 Q'+m+' -14 '+(z-6)+' 62" fill="none" stroke="#F0483E" stroke-width="6" stroke-linecap="round"/>';
   if(g[0]==='c')svg+='<text x="'+m+'" y="50" text-anchor="middle" font-size="26" fill="#F0483E">♪ ♫ ♪ ♫</text>';});
  const box=h('div',{style:'direction:ltr;background:var(--bg);border-radius:16px;padding:8px'}),now=h('div',{class:'big',style:'font-size:30px'},S2.n[li()]),go=h('button',{class:'pri'},'🥤 '+T('התחל','Start'));
  box.innerHTML='<svg viewBox="0 0 300 90" width="100%" role="img" aria-label="straw pattern">'+svg+'<line id="cur" x1="0" y1="4" x2="0" y2="86" stroke="var(--ink)" stroke-width="3"/></svg>';
  let last=null;if(i%2===0)say(S2.n[li()],true);
  go.onclick=()=>{go.disabled=true;beep(440);const t0=Date.now(),cur=box.querySelector('#cur');const tm=setInterval(()=>{if(!box.isConnected){clearInterval(tm);return;}const e=(Date.now()-t0)/1000;
    let acc=0,g=S2.seg[S2.seg.length-1];for(const y of S2.seg){acc+=y[1];if(e<acc){g=y;break;}}now.textContent=SEG[g[0]][2]+' '+SEG[g[0]][li()];if(g!==last){last=g;say(SEG[g[0]][li()]);}
    if(cur){cur.setAttribute('x1',Math.min(300,e/tot*300));cur.setAttribute('x2',Math.min(300,e/tot*300));}
    if(e>=tot){clearInterval(tm);win();nx();}},80);};
  b.replaceChildren(h('div',{class:'row sp'},count(i,reps.length),sayBtn(S2.n[li()])),now,box,go);},ok);}

  h('div',{class:'row'},h('button',{onclick:()=>{editing=!editing;home();}},editing?T('סיום','Done'):'✏️ '+T('שמות','Names')),
   h('button',{onclick:()=>share(out)},'📋 '+T('העתקת סיכום','Copy summary'))),out,
  h('small',null,cloud?'☁️ '+T('הטבלה מסונכרנת בין המכשירים.','The table syncs across devices.'):'📱 '+T('הטבלה נשמרת במכשיר הזה. אפשר לשלוח סיכום לקלינאי בוואטסאפ.','The table is saved on this device. You can send a summary to the therapist on WhatsApp.'))));
}
function share(out){const lines=[T('אימון בבית, סיכום עד','Home training, summary up to')+' '+today()];
 KIDS.forEach(k=>{const ds=Object.keys(S.days).filter(x=>x.startsWith(k.id+'_')).sort().slice(-14).map(x=>{const d=S.days[x];return x.slice(7)+'×'+d.n+(d.feel?'('+d.feel+(d.r?','+d.r+'/10':'')+')':'');});
  lines.push(nameOf(k)+': ★'+total(k.id)+' | '+(ds.join(', ')||'-'));});
 const txt=lines.join('\n');const show=()=>{const ta=h('textarea',{id:'sum',readonly:''});ta.value=txt;out.replaceChildren(ta);};
 try{navigator.clipboard.writeText(txt).then(()=>out.replaceChildren(h('small',null,T('הועתק. אפשר להדביק בוואטסאפ.','Copied. Paste it into WhatsApp.'))),show);}catch(e){show();}}

/* ---------- child screen ---------- */
function kidView(k){view='kid';document.body.setAttribute('data-k',k.id);app.style.setProperty('--k',k.col);setLang(lsGet('ft_lang_'+k.id)||k.lang);app.replaceChildren();
 const n=dayN(k.id,today()),tot=total(k.id),lv=Math.min(5,Math.floor(tot/PERLV)),extra=h('div');
 if(k.id==='c'){const seen=Math.min(tot,STORY.length);
  const B=['🟫','🪨','⚙️','🟨','💎','🟪'],inv=h('div',{class:'inv'});for(let j=0;j<Math.max(18,Math.ceil((tot+1)/9)*9);j++){let ti=0;TIERS.forEach((x,y)=>{if(j>=x[0])ti=y;});inv.append(h('span',null,j<tot?B[ti]:''));}
  extra.append(h('div',{class:'row sp'},h('span',null,'XP '+tot*50),h('span',null,'📖 '+seen+' / '+STORY.length)),h('h3',null,T('המלאי שלי','My inventory')),inv);
  if(seen){const box=h('div');extra.append(h('button',{onclick:()=>{box.replaceChildren(h('h3',{style:'direction:rtl;text-align:right'},fillN(STITLE,k)),...STORY.slice(0,seen).map(p=>h('div',{class:'story',style:'font-size:17px'},(p[0]?p[0]+'\n':'')+fillN(p[1],k)+'\n')));}},'📜 '+T('הסיפור עד עכשיו','The story so far')),box);}}
 else{extra.append(h('h3',null,T('אלבום המדבקות','Sticker album')),h('div',{class:'stk'},(k.id==='a'?STKA:STK).slice(0,Math.max(12,Math.min(STK.length,tot+6))).map((s,i)=>h('span',{class:i<tot?'':'no'},s))));
  if(k.id==='b'){const wk='ft_w_'+today();let w=lsGet(wk)||0;const row=h('div',{class:'row ctr'});const dr=()=>{row.replaceChildren(...[1,2,3,4,5].map(i=>{const u=h('button',{'aria-label':T('כוס מים','Glass of water')},i<=w?'💧':'🥛');u.onclick=()=>{w=i===w?i-1:i;lsSet(wk,w);beep(500+i*60);dr();};return u;}));};dr();
   extra.append(h('h3',null,T('המים של היום','Today’s water')),row);}}
 app.append(h('div',{class:'row sp'},h('button',{onclick:home},T('→ חזרה','← Back')),langBtn(l=>lsSet('ft_lang_'+k.id,l),()=>kidView(k))),
  h('div',{class:'card cen'},h('div',{class:'emo bob'},k.av),h('h2',null,nameOf(k)),
   h('div',{class:'how'},rank(k,tot)+' · ★ '+tot+' · '+T('שלב','Level')+' '+(lv+1)+'/6'),
   h('div',{class:'prog'},h('i',{style:'width:'+((tot%PERLV)/PERLV*100)+'%'})),
   n>=MAXDAY?h('div',{class:'mid'},T('3 כוכבים היום. כל הכבוד! נתראה מחר.','3 stars today. Well done! See you tomorrow.'))
    :h('button',{class:'pri',onclick:()=>{lastR=0;gems=0;if(k.id==='c')ensureMic();run(k,mission(k,tot),0);}},n?T('עוד משימה ★','One more mission ★'):T('למשימה של היום ▶','Start today’s mission ▶')),
   h('small',null,T('משימה = 3 משחקים, בערך 5 דקות.','A mission = 3 games, about 5 minutes.'))),
  h('div',{class:'card'},extra));
}

/* ---------- mission runner ---------- */
function run(k,steps,si){view='run';if(si>=steps.length)return feel(k);
 const s=steps[si],body=h('div',{class:'card'}),done=h('button',{class:'pri',disabled:''},si<steps.length-1?T('הבא ▶','Next ▶'):T('סיימתי ✔','Finished ✔'));
 done.onclick=()=>run(k,steps,si+1);const ok=()=>{done.disabled=false;};
 app.replaceChildren(h('div',{class:'row sp'},h('button',{onclick:()=>kidView(k),'aria-label':T('יציאה','Exit')},'✕'),k.id!=='b'?(hudI=k.id==='a'?'💎':'⛏️',hud=h('span',{class:'chip on'},hudI+' '+gems)):(hud=null),h('span',{class:'chip'},(si+1)+' / '+steps.length)),
  h('div',{class:'prog'},h('i',{style:'width:'+(si/steps.length*100)+'%'})),h('h2',null,s.t),s.h?h('div',{class:'row'},h('span',{class:'how',style:'flex:1'},s.h),s.auto?sayBtn(s.h):null):null,body,done);
 if(s.auto)say(s.h);s.g(body,ok);window.scrollTo(0,0);}
function feel(k){const opts=[['😀',T('קל','Easy'),'easy'],['🙂',T('בסדר','OK'),'ok'],['😓',T('קשה','Hard'),'hard']];
 const row=h('div',{class:'row ctr'});
 opts.forEach(o=>row.append(h('button',{style:'font-size:20px',onclick:()=>{saveDay(k.id,o[2]);fin(k);}},o[0]+' '+o[1])));
 app.replaceChildren(h('div',{class:'card cen'},h('h2',null,T('איך היה?','How was it?')),row));}
function fin(k){const tot=total(k.id),c=k.id==='c',stk=(k.id==='a'?STKA:STK)[(tot-1)%STK.length];hud=null;win();confetti(c?['💎','🟩','🟫','⛏️']:k.id==='a'?['👑','💖','✨',stk]:['⭐','🎈','🌈',stk]);
 app.replaceChildren(h('div',{class:'card cen'},h('div',{class:'emo pop'},c?'🏆':stk),k.id==='a'?h('div',{class:'mid'},'💎 '+gems):null,
  h('h2',null,c?'+50 XP · ⛏️ '+gems:T('מדבקה חדשה!','New sticker!')),h('div',{class:'mid'},'★ '+tot+' · '+rank(k,tot)),
  c&&tot<STORY.length?h('div',{class:'how'},'🔓 '+T('הקטע הבא של הסיפור נפתח במשימה הבאה.','The next part of the story unlocks in your next mission.')):null,
  h('button',{class:'pri',onclick:home},T('לטבלה','To the table'))));}

home();pull();setInterval(()=>{if(view==='home')pull();},30000);
</script>
